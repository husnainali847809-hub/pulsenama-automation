name: Unique News Publisher

on:
  schedule:
    # Every 3 hours (UTC). Change as you like.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Max articles to queue in this run (1-5)"
        required: false
        default: "1"

permissions:
  contents: write

# Never run two publishers at the same time (protects seen.json)
concurrency:
  group: unique-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unique News
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_HORDE_API_KEY: ${{ secrets.AI_HORDE_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # Works whether you stored these as Secrets or as Variables
          GEMINI_TEXT_MODEL: ${{ secrets.GEMINI_TEXT_MODEL || vars.GEMINI_TEXT_MODEL }}
          MAX_ARTICLES_PER_RUN: ${{ inputs.max_articles || secrets.MAX_ARTICLES_PER_RUN || vars.MAX_ARTICLES_PER_RUN || '1' }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Commit seen.json
        if: always()
        run: |
          if [ ! -f seen.json ]; then
            echo "No seen.json to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "seen.json unchanged."
            exit 0
          fi
          git commit -m "Update seen.json [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed, retrying..."
            sleep 5
          done
          echo "::error::Could not push seen.json"
          exit 1
