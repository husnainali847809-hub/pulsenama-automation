name: Unique News Publisher

on:
  workflow_dispatch:
  schedule:
    # Five runs per day (UTC). Buffer controls the actual queue timing.
    - cron: "0 3,7,11,15,19 * * *"

permissions:
  contents: write

concurrency:
  group: unique-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run publisher
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: "6aeb3cc2e29c69a1715d606e"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          MAX_ARTICLES_PER_RUN: "1"
        run: python main.py

      - name: Save duplicate history
        if: always()
        run: | if [[ -n "$(git status --porcelain seen.json)" ]]; then git config user.name "github-actions[bot]" git config user.email "41898282+github-actions[bot]@users.noreply.github.com" git add seen.json git commit -m "Update Unique News history" || true git push fi
