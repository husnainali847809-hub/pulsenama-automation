name: Pulsenama AI Poetry Video Creator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poetry-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fluidsynth timgm6mb-soundfont fonts-noto-core fonts-dejavu-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow pretty_midi
      - name: Validate script
        run: python -m py_compile poetry_demo.py
      - name: Generate poetry video
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: python poetry_demo.py
      - name: Upload MP4 and attribution note
        uses: actions/upload-artifact@v4
        with:
          name: pulsenama-poetry-video
          path: |
            poetry_demo.mp4
            poetry_demo.txt
          if-no-files-found: error
          retention-days: 7
